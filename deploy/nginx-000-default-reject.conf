# Catch-all: noma'lum domen yoki to'g'ridan-to'g'ri IP bilan kelgan so'rovlarni rad etadi.
# Bo'lmasa, 443 dagi yolg'iz server bloki default_server bo'lib qolib, har qanday
# Host sarlavhasiga saytni ko'rsatadi.
#
# O'rnatish:
#   cp deploy/nginx-000-default-reject.conf /etc/nginx/sites-available/000-default-reject
#   ln -s /etc/nginx/sites-available/000-default-reject /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/omega.coffee-nap.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omega.coffee-nap.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}
